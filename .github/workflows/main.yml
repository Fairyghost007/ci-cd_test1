# Nom du workflow de CI/CD
name: CI/CD workflow
# Paramètres pour gérer la concurrence des jobs
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }} # Groupe de concurrence basé sur le nom du workflow et la référence git
    cancel-in-progress: true # Annule les jobs en cours si un nouveau job est lancé dans le même groupe
# Événement déclenchant le workflow
on:
    push: # Déclenché lors d'un push
        branches: # Sur la branche spécifiée
            - master # Branche "main"
# Description des jobs à exécuter
jobs:
    # Job pour les tests
    tests_backend:
        runs-on: ubuntu-latest # Exécute sur la dernière version d'Ubuntu
        defaults: # Options par défaut pour les étapes
            run:
                working-directory: server # Dossier de travail par défaut
        steps:
            - name: checkout le code # Récupère le code source
              uses: actions/checkout@v4 # Utilise l'action de checkout
            - name: installer Node.js # Installe Node.js
              uses: actions/setup-node@v3 # Utilise l'action setup-node
              with: # Options supplémentaires
                  cache: "npm" # Met en cache les dépendances npm
                  cache-dependency-path: server/package-lock.json # Chemin du fichier package-lock.json
            - name: installer les dépendances # Installe les dépendances npm
              run: | # Commandes shell à exécuter
                  npm ci  # Installe les dépendances en mode "clean install"
            - name: vérifie le code # Exécute le linter sur le code
              run: |
                  npm run lint  # Exécute le script de lint
            - name: vérifie les vulnérabilités # Vérifie les vulnérabilités des dépendances
              run: |
                  npm audit  # Utilise npm audit pour identifier les vulnérabilités
            - name: exécute les tests # Exécute les tests
              run: |
                  npm run test:ci  # Exécute le script de test
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
    checks_frontend: # job pour les vérifications sur le frontend
        runs-on: ubuntu-latest # environnement d'exécution
        steps: # les étapes du job
            - name: checkout le code # récupère le code source
              uses: actions/checkout@v4

            - name: installer Node.js # installe Node.js
              uses: actions/setup-node@v3 # utilise l'action setup-node en version 3
              with:
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json # chemin vers le package-lock.json pour le cache

            - name: installer les dépendances # installe les dépendances npm
              run: |
                  cd client
                  npm ci --prefer-offline

            - name: vérifie les vulnérabilités # vérifie les vulnérabilités dans les dépendances
              run: |
                  cd client
                  npm audit

            - name: vérifie le code # vérifie le style du code avec lint
              run: |
                  cd client
                  npm run lint

    build_frontend: # job pour construire le frontend
        runs-on: ubuntu-latest # environnement d'exécution
        defaults: # définition des valeurs par défaut pour les étapes
            run: # définition des valeurs par défaut pour les étapes run
                working-directory: client # définit le dossier de travail par défaut pour les étapes run
        needs: [checks_frontend] # dépend du job checks_frontend
        steps: # les étapes du job
            - name: checkout le code # récupère le code source
              uses: actions/checkout@v4

            - name: installer Node.js # installe Node.js
              uses: actions/setup-node@v3 # utilise l'action setup-node en version 3
              with:
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json # chemin vers le package-lock.json pour le cache

            - name: installer les dépendances # installe les dépendances npm
              run: |
                  npm ci --prefer-offline

            - name: build le frontend # construit le frontend
              run: |
                  npm run build

            - name: archiver les artefacts # archive le dossier 'dist' pour une utilisation ultérieure
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist # nom de l'artéfact
                  path: client/dist/ # chemin de l'artéfact
                  retention-days: 1 # durée de rétention de l'artéfact
    test_e2e:
        runs-on: ubuntu-latest
        needs: [build_frontend]
        steps:
            - name: checkout le code
              uses: actions/checkout@v4

            - name: télécharger l'artéfact du frontend
              uses: actions/download-artifact@v4
              with:
                  name: frontend-dist
                  path: client/dist/

            - name: installer Node.js
              uses: actions/setup-node@v3
              with:
                  cache: "npm"
                  cache-dependency-path: server/package-lock.json

            - name: installer les dépendances serveur
              run: |
                  cd server
                  npm ci --prefer-offline

            - name: lancer le serveur backend
              run: |
                  cd server
                  node index.js &

            - name: Cypress
              uses: cypress-io/github-action@v6
              with:
                  working-directory: client
                  browser: chrome
                  start: npm run preview
                  wait-on: http://localhost:4173
                  wait-on-timeout: 60
                  config: baseUrl=http://localhost:4173
    # Job pour le déploiement
    deploy:
        needs: [test_e2e, tests_backend] # Dépend des jobs "checks_frontend", "tests_backend" et "build_frontend"
        runs-on: ubuntu-latest # Exécute sur la dernière version d'Ubuntu
        steps:
            - name: checkout le code # récupère le code source
              uses: actions/checkout@v4

            - name: télécharger l'artéfact du frontend # télécharge l'artéfact archivé précédemment
              uses: actions/download-artifact@v4
              with:
                  name: frontend-dist # nom de l'artéfact
                  path: ./dist # chemin où l'artéfact sera téléchargé
            - name: déclenche le déploiement sur Render # Appelle le Deploy Hook de Render
              run: | # Commandes shell à exécuter
                  curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"  # Déclenche un nouveau déploiement via l'URL secrète du service Render
